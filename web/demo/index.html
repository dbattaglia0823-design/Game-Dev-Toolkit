<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game Development Toolkit · Web UI Demo</title><link rel="stylesheet" href="../ui/theme.css"></head>
<body class="gdt-page"><div id="toast" class="gdt-toast" hidden></div><main class="gdt-panel">
  <p class="gdt-muted">Game Development Toolkit / web</p><h1>Reusable UI + persistence</h1>
  <p>Preview accessible navigation tabs, a modal, dark-glass controls, settings and versioned saves.</p>
  <div class="gdt-tabs" id="demo-tabs">
    <div role="tablist" aria-label="Demo sections" class="gdt-tablist">
      <button role="tab" id="tab-game" aria-controls="panel-game">Game</button>
      <button role="tab" id="tab-settings" aria-controls="panel-settings">Settings</button>
    </div>
    <section role="tabpanel" id="panel-game" aria-labelledby="tab-game">
      <p id="status" class="gdt-muted"></p>
      <div class="gdt-actions"><button class="gdt-btn gdt-btn--primary" id="score">Add score +10</button><button class="gdt-btn" id="save">Save</button><button class="gdt-btn" id="load">Load</button></div>
    </section>
    <section role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
      <p class="gdt-muted">Settings persist across reloads.</p><button class="gdt-btn" id="sound">Toggle sound</button>
    </section>
  </div>
  <div class="gdt-actions gdt-section"><button class="gdt-btn" id="open-dialog">Show modal</button></div>
</main>
<dialog id="demo-dialog" class="gdt-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">Reusable dialog</h2><p>Native modal with Escape, focus management and a close action.</p><button class="gdt-btn gdt-btn--primary" data-gdt-close>Close</button></dialog>
<script type="module" src="./main.js"></script></body></html>
