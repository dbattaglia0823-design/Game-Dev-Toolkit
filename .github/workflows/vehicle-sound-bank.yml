name: Vehicle sound bank tests
on:
  push:
    paths:
      - 'sound-bank/**'
      - 'godot/audio/**'
      - '.github/workflows/vehicle-sound-bank.yml'
  pull_request:
    paths:
      - 'sound-bank/**'
      - 'godot/audio/**'
      - '.github/workflows/vehicle-sound-bank.yml'
jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s sound-bank/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sound-bank/packs/v8-performance-v1/tests/*.test.mjs
