name: Knowledge and scaffold checks

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'templates/project/**'
      - '.agents/skills/**'
      - 'tools/scaffold_project_knowledge.py'
      - 'tools/install_project_skills.py'
      - 'tools/benchmark_knowledge_usage.py'
      - 'tools/check_knowledge_links.py'
      - 'tools/audit_project_knowledge.py'
      - 'tools/tests/**'
      - '.github/workflows/knowledge-tests.yml'
      - 'AGENTS.md'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'templates/project/**'
      - '.agents/skills/**'
      - 'tools/scaffold_project_knowledge.py'
      - 'tools/install_project_skills.py'
      - 'tools/benchmark_knowledge_usage.py'
      - 'tools/check_knowledge_links.py'
      - 'tools/audit_project_knowledge.py'
      - 'tools/tests/**'
      - '.github/workflows/knowledge-tests.yml'
      - 'AGENTS.md'
      - 'README.md'

jobs:
  scaffold-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run knowledge and installer unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Check knowledge links and skill metadata
        run: python3 tools/check_knowledge_links.py
      - name: Validate project registry metadata (no cross-repo network access)
        run: python3 tools/audit_project_knowledge.py
